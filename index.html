<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://widget.mixcloud.com/media/js/widgetApi.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            dyme: {
              orange: '#FF7A00',
              orangeHover: '#FFA04D',
              borderDark: '#172033',
              navyDark: '#070c18',
              navyCard: '#0e1626'
            },
            spotify: {
              green: '#10B981',
              greenHover: '#059669',
              black: '#121212',
            }
          },
          fontFamily: {
            display: ['Montserrat', 'sans-serif'],
            sans: ['Space Grotesk', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          }
        }
      }
    }
  </script>

  <style>
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #070c18; }
    ::-webkit-scrollbar-thumb { background: #FF7A00; border-radius: 4px; }

    /* Fixed Stationary City Background with Dark Navy Blue Tint */
    .bg-city-fixed {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: -20;
      background-image: url('images/city%20night_2.jpg'), url('city%20night_2.jpg'), url('images/city%20night.jpg');
      background-size: contain;
      background-position: center center;
      background-repeat: no-repeat;
      filter: grayscale(100%) contrast(140%) blur(4px);
      opacity: 0.12;
      pointer-events: none;
    }

    /* Balanced Dark Navy & Amber Atmospheric Overlay */
    .bg-ambient-overlay {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: -10;
      background: radial-gradient(circle at 50% 0%, rgba(255, 122, 0, 0.10) 0%, transparent 45%),
                  radial-gradient(circle at 85% 35%, rgba(30, 41, 59, 0.4) 0%, transparent 45%),
                  radial-gradient(circle at 15% 65%, rgba(14, 22, 38, 0.6) 0%, transparent 45%),
                  radial-gradient(circle at 50% 50%, rgba(11, 20, 38, 0.70) 0%, rgba(7, 12, 24, 0.90) 65%, rgba(0, 0, 0, 0.96) 100%);
      pointer-events: none;
    }

    body {
      background-color: #070c18;
      color: #e2e8f0;
      font-family: 'Space Grotesk', sans-serif;
    }

    /* Frosted Dark Navy Cards with Refined Neutral Border */
    .depth-card {
      background: rgba(11, 18, 32, 0.88) !important;
      backdrop-filter: blur(14px) saturate(140%) !important;
      -webkit-backdrop-filter: blur(14px) saturate(140%) !important;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 12px 30px -8px rgba(0, 0, 0, 0.85), 0 4px 12px -2px rgba(0, 0, 0, 0.5);
    }

    .ticker-wrap { overflow: hidden; white-space: nowrap; }
    .ticker-track { display: inline-flex; animation: tickerLoop 26s linear infinite; }
    @keyframes tickerLoop { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
    .eq-bar { animation: bounce 1.1s ease-in-out infinite alternate; }
    .eq-paused .eq-bar { animation: none !important; height: 3px !important; opacity: 0.35; }
    @keyframes bounce { 0% { height: 3px; } 100% { height: 14px; } }
    .vault-scroll-container { max-height: 400px; overflow-y: auto; padding-right: 4px; }

    /* Unique Audio VU Meter Expand Button */
    .vu-expand-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: rgba(11, 18, 32, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #e2e8f0;
      padding: 9px 20px;
      border-radius: 9999px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.08em;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.6);
    }
    .vu-expand-btn:hover {
      border-color: #FF7A00;
      color: #FFA04D;
      box-shadow: 0 0 16px rgba(255, 122, 0, 0.25);
      transform: translateY(-1px);
    }
    .vu-bars {
      display: flex;
      align-items: flex-end;
      gap: 2.5px;
      height: 12px;
    }
    .vu-bars .bar {
      width: 2.5px;
      background: rgba(255, 255, 255, 0.25);
      border-radius: 1px;
      animation: vuMeterPulse 1.2s ease-in-out infinite alternate;
    }
    .vu-bars .bar:nth-child(1) { height: 35%; animation-delay: 0.1s; }
    .vu-bars .bar:nth-child(2) { height: 75%; animation-delay: 0.3s; }
    .vu-bars .bar:nth-child(3) { height: 50%; animation-delay: 0.15s; }
    .vu-bars .bar.peak { height: 95%; background: #FF7A00; }
    .vu-expand-btn:hover .bar {
      background: #FFA04D;
    }
    @keyframes vuMeterPulse {
      0% { transform: scaleY(0.4); }
      100% { transform: scaleY(1); }
    }

    /* Smooth Slide-Down with Blur Reveal */
    .vu-reveal {
      transition: max-height 0.45s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s ease, filter 0.4s ease;
    }
    .vu-reveal.is-closed {
      max-height: 0;
      opacity: 0;
      filter: blur(10px);
      pointer-events: none;
      overflow: hidden;
    }
    .vu-reveal.is-open {
      max-height: 1300px;
      opacity: 1;
      filter: blur(0px);
      overflow: visible;
    }

    /* Vault Active Mode Button */
    .vault-btn-active {
      background: rgba(255, 122, 0, 0.2) !important;
      border-color: #FF7A00 !important;
      color: #FFFFFF !important;
      box-shadow: 0 0 14px rgba(255, 122, 0, 0.35);
    }
  </style>
</head>
