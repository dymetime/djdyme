<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Book DJ DYME | Secure Dates</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #070b12;
      --card-bg: #0e1526;
      --border: rgba(255, 255, 255, 0.08);
      --yellow: #f5c400;
      --yellow-hover: #ffd83b;
      --text: #f8fafc;
      --muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', sans-serif;
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Minimal Header matching djdyme.vercel.app */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
    }

    .brand {
      font-family: 'Syne', sans-serif;
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #fff;
      text-decoration: none;
    }
    .brand span {
      color: var(--yellow);
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .nav-links a {
      color: var(--muted);
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      text-decoration: none;
      transition: color 0.2s ease;
    }
    .nav-links a:hover,
    .nav-links a.active {
      color: var(--yellow);
    }

    /* Centered Streamlined Content */
    main {
      flex: 1;
      max-width: 620px;
      width: 100%;
      margin: 0 auto;
      padding: 48px 20px 60px;
    }

    .page-head {
      text-align: center;
      margin-bottom: 32px;
    }

    .badge {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: var(--yellow);
      margin-bottom: 10px;
    }

    h1 {
      font-family: 'Syne', sans-serif;
      font-size: clamp(2rem, 5vw, 2.6rem);
      font-weight: 800;
      line-height: 1.15;
      margin-bottom: 10px;
      letter-spacing: -0.01em;
    }

    .page-head p {
      color: var(--muted);
      font-size: 0.95rem;
    }

    /* Clean Integrated Booking Container */
    .booking-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 28px 24px;
    }

    .form-stack {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted);
      font-weight: 700;
    }

    input, select, textarea {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 12px 14px;
      color: #fff;
      font-family: inherit;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s ease;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--yellow);
    }

    textarea {
      resize: vertical;
      min-height: 90px;
    }

    .btn-submit {
      width: 100%;
      background: var(--yellow);
      color: #070b12;
      padding: 14px;
      font-size: 0.85rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      margin-top: 6px;
      transition: background 0.2s ease;
    }

    .btn-submit:hover {
      background: var(--yellow-hover);
    }

    .direct-links {
      margin-top: 24px;
      text-align: center;
      font-size: 0.8rem;
      color: var(--muted);
      display: flex;
      justify-content: center;
      gap: 16px;
    }

    .direct-links a {
      color: var(--muted);
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s;
    }
    .direct-links a:hover {
      color: var(--yellow);
    }

    @media (max-width: 580px) {
      .row {
        grid-template-columns: 1fr;
      }
      main {
        padding: 32px 16px 40px;
      }
      .booking-card {
        padding: 20px 16px;
      }
    }
  </style>
</head>
<body>

  <!-- Top Nav -->
  <header>
    <a href="/" class="brand">DJ <span>DYME</span></a>
    <nav class="nav-links">
      <a href="/">Mixes</a>
      <a href="/#radio">Radio</a>
      <a href="/booking.html" class="active">Bookings</a>
    </nav>
  </header>

  <!-- Form Body -->
  <main>
    <div class="page-head">
      <span class="badge">Pull Up Fridays • Dymetime Radio</span>
      <h1>Secure Your Date</h1>
      <p>Tell me about your event. I'll get back to you with availability and rates.</p>
    </div>

    <div class="booking-card">
      <form id="bookingForm" class="form-stack">
        <div class="row">
          <div class="field">
            <label for="name">Your Name</label>
            <input type="text" id="name" placeholder="Full name" required />
          </div>
          <div class="field">
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" placeholder="(000) 000-0000" required />
          </div>
        </div>

        <div class="row">
          <div class="field">
            <label for="eventType">Event Type</label>
            <select id="eventType" required>
              <option value="Wedding">Wedding</option>
              <option value="Club / Lounge">Club / Lounge</option>
              <option value="Private Event / Birthday">Private Event / Birthday</option>
              <option value="Corporate / Gala">Corporate / Gala</option>
              <option value="Festival / Concert">Festival / Concert</option>
              <option value="Other">Other</option>
            </select>
          </div>
          <div class="field">
            <label for="date">Event Date</label>
            <input type="date" id="date" required />
          </div>
        </div>

        <div class="field">
          <label for="location">Location / Venue</label>
          <input type="text" id="location" placeholder="City, State & Venue name" required />
        </div>

        <div class="field">
          <label for="notes">Details (Optional)</label>
          <textarea id="notes" placeholder="Hours needed, sound system requirements, or music style..."></textarea>
        </div>

        <button type="submit" class="btn-submit">Submit Inquiry</button>
      </form>
    </div>

    <div class="direct-links">
      <a href="https://instagram.com/djdyme" target="_blank" rel="noopener">Instagram @djdyme</a>
      <span>•</span>
      <a href="https://mixcloud.com/djdyme" target="_blank" rel="noopener">Mixcloud</a>
    </div>
  </main>

  <script>
    document.getElementById('bookingForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const name = document.getElementById('name').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const eventType = document.getElementById('eventType').value;
      const date = document.getElementById('date').value;
      const location = document.getElementById('location').value.trim();
      const notes = document.getElementById('notes').value.trim();

      const subject = encodeURIComponent(`Booking Inquiry: ${eventType} - ${date} (${name})`);
      const body = encodeURIComponent(
        `Hi DJ DYME,\n\nHere are my event booking details:\n\n` +
        `• Name: ${name}\n` +
        `• Phone: ${phone}\n` +
        `• Event: ${eventType}\n` +
        `• Date: ${date}\n` +
        `• Location: ${location}\n` +
        `• Notes: ${notes || 'None'}\n`
      );

      window.location.href = `mailto:booking@djdyme.com?subject=${subject}&body=${body}`;
    });
  </script>
</body>
</html>
